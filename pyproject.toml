[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mscmap"
version = "0.3.0"
description = "Reproducible demand-aware patch remapping and MSC scheduling experiments"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6"]
qiskit = ["qiskit>=2.1"]
plot = ["matplotlib>=3.8"]
dev = ["ruff>=0.9"]

[project.scripts]
mscmap = "main:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = [
    "analysis", "experiments", "ir", "main", "mapping", "metrics", "model",
    "plot_active_series", "policies", "puremagic_compare", "qasm_benchmark", "qiskit_io",
    "sim", "swaps", "workload_sweep",
]

[tool.ruff]
src = ["src"]
line-length = 100
