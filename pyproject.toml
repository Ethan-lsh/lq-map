[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mscmap"
version = "0.1.0"
description = "Reproducible abstract MSC placement and DAG scheduling experiments"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6"]
dev = ["ruff>=0.9"]

[project.scripts]
mscmap = "mscmap.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
